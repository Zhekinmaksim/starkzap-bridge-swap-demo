  <rect x="80" y="66" width="1040" height="22" rx="5" fill="#0B3E31"/>
  <text x="92" y="81" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.8">TX BATCHING</text>

  <text x="80" y="138" fill="#FFF6EE" font-family="Space Grotesk, sans-serif" font-size="56" font-weight="700">Swap + transfer =</text>
  <text x="80" y="177" fill="#73E3C1" font-family="Space Grotesk, sans-serif" font-size="56" font-weight="700">1 Starknet tx</text>

  <rect x="80" y="222" width="1040" height="310" rx="12" fill="#0A0B17" stroke="#262B45"/>
  <text x="108" y="287" fill="#96A8FF" font-family="JetBrains Mono, monospace" font-size="16">const tx = await wallet</text>
  <text x="108" y="311" fill="#96A8FF" font-family="JetBrains Mono, monospace" font-size="16">  .tx()</text>
  <text x="108" y="335" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="16">  .swap({</text>
  <text x="132" y="359" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">provider: "avnu",</text>
  <text x="132" y="383" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">tokenIn: tokens.ETH,</text>
  <text x="132" y="407" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">tokenOut: tokens.USDC,</text>
  <text x="132" y="431" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">amountIn: Amount.parse("0.01", tokens.ETH),</text>
  <text x="132" y="455" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">slippageBps: 100n,</text>
  <text x="108" y="479" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="16">  })</text>
  <text x="108" y="503" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="16">  .transfer(tokens.USDC, {</text>
  <text x="132" y="527" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">to: recipient, amount: Amount.parse("2", tokens.USDC),</text>
  <text x="108" y="551" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="16">  })</text>
  <text x="108" y="575" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="16">  .send({ feeMode: "sponsored" });</text>

  <rect x="80" y="553" width="1040" height="56" fill="#131322"/>
  <rect x="80" y="553" width="3" height="56" fill="#73E3C1"/>
  <text x="102" y="587" fill="#E7D8CC" font-family="JetBrains Mono, monospace" font-size="17">One builder. One signature. One Starknet transaction hash.</text>

