  <rect x="80" y="140" width="1040" height="22" rx="5" fill="#4A2217"/>
  <text x="92" y="155" fill="#FFAD87" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.8">HONEST REVIEW</text>

  <text x="80" y="209" fill="#FFF6EE" font-family="Space Grotesk, sans-serif" font-size="54" font-weight="700">After building with Starkzap v2</text>

  <rect x="80" y="261" width="504" height="198" rx="10" fill="#0F1020" stroke="#1F5C4D"/>
  <text x="104" y="304" fill="#4DE0B2" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700">What's good</text>
  <text x="104" y="340" fill="#A8A3A0" font-family="JetBrains Mono, monospace" font-size="17">API feels closer to a product SDK</text>
  <text x="104" y="372" fill="#A8A3A0" font-family="JetBrains Mono, monospace" font-size="17">Amount types reduce unit mistakes</text>
  <text x="104" y="404" fill="#A8A3A0" font-family="JetBrains Mono, monospace" font-size="17">Swaps and tx batching are clean</text>
  <text x="104" y="436" fill="#A8A3A0" font-family="JetBrains Mono, monospace" font-size="17">Token presets save time and prevent copy errors</text>

  <rect x="616" y="261" width="504" height="198" rx="10" fill="#0F1020" stroke="#6B3426"/>
  <text x="640" y="304" fill="#FF7B66" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700">What needs work</text>
  <text x="640" y="340" fill="#A8A3A0" font-family="JetBrains Mono, monospace" font-size="17">Bridge docs are thinner than wallet + swap docs</text>
  <text x="640" y="372" fill="#A8A3A0" font-family="JetBrains Mono, monospace" font-size="17">Sponsored mode needs clearer paymaster setup docs</text>
  <text x="640" y="404" fill="#A8A3A0" font-family="JetBrains Mono, monospace" font-size="17">Network mismatch errors could be more explicit</text>

  <rect x="80" y="480" width="1040" height="56" fill="#131322"/>
  <rect x="80" y="480" width="3" height="56" fill="#FF7B66"/>
  <text x="102" y="514" fill="#E7D8CC" font-family="JetBrains Mono, monospace" font-size="17">Overall: one of the cleaner SDK experiences I've seen for shipping DeFi UX on a new app.</text>

  <text x="80" y="647" fill="#3E4355" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.4">POWERED BY STARKNET</text>
