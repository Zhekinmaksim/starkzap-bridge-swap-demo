<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="960" fill="#081118"/>
  <rect x="36" y="36" width="1528" height="888" rx="28" fill="#0D1822" stroke="#1F3140"/>
  <circle cx="80" cy="80" r="10" fill="#FF6B6B"/>
  <circle cx="112" cy="80" r="10" fill="#FFD166"/>
  <circle cx="144" cy="80" r="10" fill="#3DD494"/>
  <text x="72" y="150" fill="#7FD8B4" font-family="Space Grotesk, sans-serif" font-size="24" letter-spacing="4">STARKZAP V2 DEMO</text>
  <text x="72" y="228" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="72" font-weight="700">Bridge ETH. Swap to USDC.</text>
  <text x="72" y="302" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="72" font-weight="700">Show balances. Batch actions.</text>
  <text x="72" y="358" fill="#ABC0D4" font-family="Space Grotesk, sans-serif" font-size="28">Preview asset for the repo README. Replace with a live browser screenshot after your first local run.</text>

  <rect x="72" y="414" width="454" height="188" rx="24" fill="#12202C" stroke="#223646"/>
  <text x="104" y="460" fill="#7FD8B4" font-family="Space Grotesk, sans-serif" font-size="22" letter-spacing="2">STEP 1</text>
  <text x="104" y="510" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="700">Connect Starknet</text>
  <rect x="104" y="540" width="388" height="40" rx="14" fill="#0D1822" stroke="#274354"/>
  <text x="122" y="566" fill="#9CB4C8" font-family="JetBrains Mono, monospace" font-size="18">VITE_PRIVATE_KEY=0x...</text>

  <rect x="556" y="414" width="454" height="188" rx="24" fill="#12202C" stroke="#223646"/>
  <text x="588" y="460" fill="#7FD8B4" font-family="Space Grotesk, sans-serif" font-size="22" letter-spacing="2">STEP 2</text>
  <text x="588" y="510" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="700">Bridge ETH</text>
  <text x="588" y="556" fill="#ABC0D4" font-family="Space Grotesk, sans-serif" font-size="24">Injected Ethereum wallet + wallet.deposit(...)</text>
  <text x="588" y="590" fill="#ABC0D4" font-family="JetBrains Mono, monospace" font-size="18">L1 fee / L2 fee / allowance / balance</text>

  <rect x="1040" y="414" width="454" height="188" rx="24" fill="#12202C" stroke="#223646"/>
  <text x="1072" y="460" fill="#7FD8B4" font-family="Space Grotesk, sans-serif" font-size="22" letter-spacing="2">STEP 3</text>
  <text x="1072" y="510" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="700">Swap ETH → USDC</text>
  <text x="1072" y="556" fill="#ABC0D4" font-family="Space Grotesk, sans-serif" font-size="24">AVNU quote + swap, sponsored if paymaster is live</text>
  <text x="1072" y="590" fill="#ABC0D4" font-family="JetBrains Mono, monospace" font-size="18">wallet.getQuote(...) / wallet.swap(...)</text>

  <rect x="72" y="642" width="708" height="220" rx="24" fill="#101B26" stroke="#223646"/>
  <text x="104" y="688" fill="#7FD8B4" font-family="Space Grotesk, sans-serif" font-size="22" letter-spacing="2">BALANCES</text>
  <rect x="104" y="718" width="184" height="112" rx="18" fill="#152532"/>
  <text x="128" y="760" fill="#9CB4C8" font-family="Space Grotesk, sans-serif" font-size="20">ETH</text>
  <text x="128" y="805" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700">0.005</text>
  <rect x="308" y="718" width="184" height="112" rx="18" fill="#152532"/>
  <text x="332" y="760" fill="#9CB4C8" font-family="Space Grotesk, sans-serif" font-size="20">USDC</text>
  <text x="332" y="805" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700">42.00</text>
  <rect x="512" y="718" width="184" height="112" rx="18" fill="#152532"/>
  <text x="536" y="760" fill="#9CB4C8" font-family="Space Grotesk, sans-serif" font-size="20">STRK</text>
  <text x="536" y="805" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700">150.25</text>

  <rect x="812" y="642" width="682" height="220" rx="24" fill="#101B26" stroke="#223646"/>
  <text x="844" y="688" fill="#7FD8B4" font-family="Space Grotesk, sans-serif" font-size="22" letter-spacing="2">BONUS</text>
  <text x="844" y="736" fill="#F4F7FB" font-family="Space Grotesk, sans-serif" font-size="38" font-weight="700">Atomic batch transaction</text>
  <text x="844" y="786" fill="#ABC0D4" font-family="JetBrains Mono, monospace" font-size="22">wallet.tx().swap(...).transfer(...).send()</text>
  <text x="844" y="828" fill="#ABC0D4" font-family="Space Grotesk, sans-serif" font-size="22">One signature. One transaction hash. One clean demo.</text>
</svg>
