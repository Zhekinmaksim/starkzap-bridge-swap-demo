      <path d="M40 0H0V40" fill="none" stroke="#1B2235"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#0B0D19"/>
  <rect width="1200" height="4" fill="url(#topGradient3)"/>
  <rect width="1200" height="675" fill="url(#grid3)" opacity="0.75"/>

  <g opacity="0.12">
    <path d="M948 92L1108 252L948 412L788 252L948 92Z" stroke="#5B2331"/>
    <path d="M948 128L1072 252L948 376L824 252L948 128Z" stroke="#5B2331"/>
    <path d="M1120 520L1200 600" stroke="#5B2331"/>
    <path d="M1044 644L1168 520L1292 644L1168 768L1044 644Z" stroke="#5B2331"/>
  </g>

  <path d="M44 34L54 24L64 34L54 44L44 34Z" stroke="#FF7B66" stroke-width="2.4"/>
  <text x="78" y="39" fill="#FF7B66" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.8">STARKNET</text>

  <rect x="80" y="66" width="1040" height="22" rx="5" fill="#1F225C"/>
  <text x="92" y="81" fill="#AEB6FF" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.8">SDK + WALLET</text>

  <text x="80" y="138" fill="#FFF6EE" font-family="Space Grotesk, sans-serif" font-size="54" font-weight="700">Initialize SDK +</text>
  <text x="80" y="177" fill="#73E3C1" font-family="Space Grotesk, sans-serif" font-size="54" font-weight="700">connect signer wallet</text>

  <rect x="80" y="222" width="1040" height="310" rx="12" fill="#0A0B17" stroke="#262B45"/>

  <text x="108" y="286" fill="#96A8FF" font-family="JetBrains Mono, monospace" font-size="16">import { StarkZap, StarkSigner, AvnuSwapProvider } from "starkzap";</text>
  <text x="108" y="334" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">const sdk = new StarkZap({ network: "sepolia" });</text>
  <text x="108" y="382" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">const wallet = await sdk.connectWallet({</text>
  <text x="132" y="406" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">account: { signer: new StarkSigner(privateKey) },</text>
  <text x="132" y="430" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">swapProviders: [new AvnuSwapProvider()],</text>
  <text x="132" y="454" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">defaultSwapProviderId: "avnu",</text>
  <text x="108" y="478" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="16">});</text>
  <text x="108" y="526" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="16">await wallet.ensureReady({ deploy: "if_needed" });</text>

  <rect x="80" y="553" width="1040" height="56" fill="#131322"/>
  <rect x="80" y="553" width="3" height="56" fill="#AEB6FF"/>
  <text x="102" y="587" fill="#E7D8CC" font-family="JetBrains Mono, monospace" font-size="17">One SDK instance. One wallet object. One readiness call.</text>

  <text x="80" y="647" fill="#3E4355" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.4">POWERED BY STARKNET</text>
  <text x="1084" y="647" fill="#3E4355" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.4">3 / 9</text>
</svg>
