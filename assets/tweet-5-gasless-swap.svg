  <path d="M44 34L54 24L64 34L54 44L44 34Z" stroke="#FF7B66" stroke-width="2.4"/>
  <text x="78" y="39" fill="#FF7B66" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.8">STARKNET</text>

  <rect x="80" y="66" width="1040" height="22" rx="5" fill="#4A2217"/>
  <text x="92" y="81" fill="#FFAD87" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.8">GASLESS SWAP</text>

  <text x="80" y="138" fill="#FFF6EE" font-family="Space Grotesk, sans-serif" font-size="54" font-weight="700">Quote + swap</text>
  <text x="80" y="177" fill="#73E3C1" font-family="Space Grotesk, sans-serif" font-size="54" font-weight="700">ETH -&gt; USDC</text>

  <rect x="80" y="222" width="1040" height="310" rx="12" fill="#0A0B17" stroke="#262B45"/>

  <text x="108" y="256" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="14">const tokens = getPresets(wallet.getChainId());</text>
  <text x="108" y="278" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="14">const quote = await wallet.getQuote({</text>
  <text x="132" y="299" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="14">provider: "avnu",</text>
  <text x="132" y="320" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="14">tokenIn: tokens.ETH,</text>
  <text x="132" y="341" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="14">tokenOut: tokens.USDC,</text>
  <text x="132" y="362" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="14">amountIn: Amount.parse("0.005", tokens.ETH),</text>
  <text x="132" y="383" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="14">slippageBps: 100n,</text>
  <text x="108" y="404" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="14">});</text>
  <text x="108" y="436" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="14">const tx = await wallet.swap(</text>
  <text x="132" y="457" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="14">{</text>
  <text x="156" y="478" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="14">provider: "avnu", tokenIn: tokens.ETH, tokenOut: tokens.USDC,</text>
  <text x="156" y="499" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="14">amountIn: Amount.parse("0.005", tokens.ETH), slippageBps: 100n,</text>
  <text x="132" y="520" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="14">}, { feeMode: "sponsored" });</text>
  <text x="108" y="541" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="14">await tx.wait();</text>

  <rect x="80" y="553" width="1040" height="56" fill="#131322"/>
  <rect x="80" y="553" width="3" height="56" fill="#FF7B66"/>
  <text x="102" y="587" fill="#E7D8CC" font-family="JetBrains Mono, monospace" font-size="17">Clean swap flow. Sponsored mode still needs real paymaster setup.</text>

