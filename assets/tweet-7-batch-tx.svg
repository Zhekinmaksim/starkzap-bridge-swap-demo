    <path d="M1044 644L1168 520L1292 644L1168 768L1044 644Z" stroke="#5B2331"/>
  </g>

  <path d="M44 34L54 24L64 34L54 44L44 34Z" stroke="#FF7B66" stroke-width="2.4"/>
  <text x="78" y="39" fill="#FF7B66" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.8">STARKNET</text>

  <rect x="80" y="66" width="1040" height="22" rx="5" fill="#0B3E31"/>
  <text x="92" y="81" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1.8">TX BATCHING</text>

  <text x="80" y="138" fill="#FFF6EE" font-family="Space Grotesk, sans-serif" font-size="54" font-weight="700">Swap + transfer =</text>
  <text x="80" y="177" fill="#73E3C1" font-family="Space Grotesk, sans-serif" font-size="54" font-weight="700">1 transaction</text>

  <rect x="80" y="222" width="1040" height="310" rx="12" fill="#0A0B17" stroke="#262B45"/>

  <text x="108" y="272" fill="#96A8FF" font-family="JetBrains Mono, monospace" font-size="15">const tx = await wallet</text>
  <text x="126" y="295" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="15">.tx()</text>
  <text x="126" y="318" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="15">.swap({</text>
  <text x="150" y="341" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="15">provider: "avnu",</text>
  <text x="150" y="364" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="15">tokenIn: tokens.ETH,</text>
  <text x="150" y="387" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="15">tokenOut: tokens.USDC,</text>
  <text x="150" y="410" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="15">amountIn: Amount.parse("0.01", tokens.ETH),</text>
  <text x="150" y="433" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="15">slippageBps: 100n,</text>
  <text x="126" y="456" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="15">})</text>
  <text x="126" y="479" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="15">.transfer(tokens.USDC, {</text>
  <text x="150" y="502" fill="#F0E2D8" font-family="JetBrains Mono, monospace" font-size="15">to: recipient, amount: Amount.parse("2", tokens.USDC),</text>
  <text x="126" y="525" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="15">})</text>
  <text x="126" y="548" fill="#73E3C1" font-family="JetBrains Mono, monospace" font-size="15">.send({ feeMode: "sponsored" });</text>

  <rect x="80" y="553" width="1040" height="56" fill="#131322"/>
  <rect x="80" y="553" width="3" height="56" fill="#73E3C1"/>
  <text x="102" y="587" fill="#E7D8CC" font-family="JetBrains Mono, monospace" font-size="17">One builder. One signature. One Starknet transaction hash.</text>

  <text x="80" y="647" fill="#3E4355" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.4">POWERED BY STARKNET</text>
  <text x="1084" y="647" fill="#3E4355" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.4">7 / 9</text>
