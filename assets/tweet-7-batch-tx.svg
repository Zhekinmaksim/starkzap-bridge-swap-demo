<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#071119"/>
  <rect x="52" y="52" width="1496" height="796" rx="28" fill="#0D1822" stroke="#223646"/>
  <text x="88" y="118" fill="#7FD8B4" font-family="Space Grotesk, sans-serif" font-size="28" letter-spacing="3">TWEET 7 · BATCH TRANSACTION</text>
  <rect x="88" y="160" width="1424" height="624" rx="24" fill="#101B26" stroke="#1F3140"/>
  <text x="124" y="248" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">const tx = await wallet</text>
  <text x="164" y="300" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">.tx()</text>
  <text x="164" y="352" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">.swap({</text>
  <text x="204" y="404" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">provider: "avnu",</text>
  <text x="204" y="456" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">tokenIn: tokens.ETH,</text>
  <text x="204" y="508" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">tokenOut: tokens.USDC,</text>
  <text x="204" y="560" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">amountIn: Amount.parse("0.01", tokens.ETH),</text>
  <text x="164" y="612" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">})</text>
  <text x="164" y="664" fill="#F4F7FB" font-family="JetBrains Mono, monospace" font-size="30">.transfer(tokens.USDC, { to: recipient, amount: Amount.parse("2", tokens.USDC) })</text>
  <text x="164" y="716" fill="#7FD8B4" font-family="JetBrains Mono, monospace" font-size="30">.send({ feeMode: "sponsored" });</text>
  <text x="88" y="828" fill="#ABC0D4" font-family="Space Grotesk, sans-serif" font-size="24">One builder. One signature. One Starknet transaction.</text>
</svg>
